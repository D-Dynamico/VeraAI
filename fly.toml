app = "vera-magicpin"
primary_region = "bom"

[build]

[http_service]
  internal_port = 8080
  force_https = true

  # Context lives in memory. A machine that sleeps wakes up with nothing pushed
  # to it, and three consecutive healthz failures is disqualification rather
  # than a penalty — so it never stops, and never scales past one.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # The judge sends at most 10 requests/sec. Limits well above that keep Fly
  # from queueing or shedding a burst of context pushes during warmup.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

  [[http_service.checks]]
    method = "GET"
    path = "/v1/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
